
name: APK Derle

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node build-www.js
      - run: npx cap add android

      - name: Uygulama simgesini oluştur
        run: npx @capacitor/assets generate --android

      - name: Yatay ekrana kilitle
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - run: npx cap sync android

      - name: APK derle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: piksel-savaslar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
